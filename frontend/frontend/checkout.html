<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — ShopWave</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="container nav-inner">
        <a href="/index.html" class="nav-brand"><span class="brand-icon">⚡</span> ShopWave</a>
        <div class="nav-links">
            <a href="/cart.html" class="nav-link">← Back to Cart</a>
            <div id="nav-user" style="display:none; align-items:center; gap:10px;">
                <span class="user-name"></span>
            </div>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <h1>Checkout</h1>
        <p>Complete your order</p>
    </div>
</div>

<main class="container" style="padding-bottom:60px;">
    <!-- Success Screen (hidden initially) -->
    <div id="order-success" style="display:none; text-align:center; padding:80px 0;">
        <div style="font-size:4rem; margin-bottom:20px;">🎉</div>
        <h2 style="font-size:2rem; font-weight:800; margin-bottom:12px;">Order Placed!</h2>
        <p style="color:var(--ink-muted); font-size:1.05rem; margin-bottom:8px;">Your order has been successfully placed and is being processed.</p>
        <p id="success-order-id" style="font-weight:700; color:var(--accent); font-size:1.1rem; margin-bottom:32px;"></p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <a href="/orders.html" class="btn btn-primary">View My Orders</a>
            <a href="/index.html" class="btn btn-ghost">Continue Shopping</a>
        </div>
    </div>

    <!-- Checkout Form -->
    <div id="checkout-content">
        <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
    </div>
</main>

<footer class="footer">
    <div class="container footer-inner">
        <span class="footer-brand">⚡ ShopWave</span>
        <span>© 2024 ShopWave. Secure Checkout.</span>
    </div>
</footer>

<script src="/js/app.js"></script>
<script>
    if (!Auth.isLoggedIn()) window.location.href = '/login.html?redirect=/checkout.html';

    let cartData = null;
    let selectedPayment = 'card';

    async function loadCheckout() {
        const { ok, data } = await apiFetch('/cart');
        if (!ok || data.data.items.length === 0) {
            window.location.href = '/cart.html';
            return;
        }
        cartData = data.data;
        renderCheckout();
    }

    function renderCheckout() {
        const shipping = cartData.total >= 50 ? 0 : 5.99;
        const tax = cartData.total * 0.08;
        const grandTotal = cartData.total + shipping + tax;

        document.getElementById('checkout-content').innerHTML = `
            <div class="checkout-layout">
                <!-- Left: Form -->
                <div>
                    <div class="card" style="margin-bottom:24px;">
                        <div class="card-body">
                            <!-- Shipping -->
                            <div class="checkout-section">
                                <h3>📦 Shipping Information</h3>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">First Name</label>
                                        <input type="text" id="ship-fname" class="form-control" placeholder="Jane">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Last Name</label>
                                        <input type="text" id="ship-lname" class="form-control" placeholder="Smith">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Street Address</label>
                                    <input type="text" id="ship-address" class="form-control" placeholder="123 Main Street">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">City</label>
                                        <input type="text" id="ship-city" class="form-control" placeholder="New York">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">ZIP Code</label>
                                        <input type="text" id="ship-zip" class="form-control" placeholder="10001">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Country</label>
                                    <select id="ship-country" class="form-control">
                                        <option value="US">United States</option>
                                        <option value="IN">India</option>
                                        <option value="GB">United Kingdom</option>
                                        <option value="CA">Canada</option>
                                        <option value="AU">Australia</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Payment -->
                            <div class="checkout-section">
                                <h3>💳 Payment Method</h3>
                                <div class="payment-options">
                                    <div class="payment-option selected" onclick="selectPayment('card', this)">
                                        <div class="payment-icon">💳</div>
                                        <div>Credit Card</div>
                                    </div>
                                    <div class="payment-option" onclick="selectPayment('paypal', this)">
                                        <div class="payment-icon">🅿️</div>
                                        <div>PayPal</div>
                                    </div>
                                    <div class="payment-option" onclick="selectPayment('upi', this)">
                                        <div class="payment-icon">📱</div>
                                        <div>UPI</div>
                                    </div>
                                    <div class="payment-option" onclick="selectPayment('cod', this)">
                                        <div class="payment-icon">💵</div>
                                        <div>Cash on Delivery</div>
                                    </div>
                                </div>

                                <div id="card-fields" style="margin-top:20px;">
                                    <div class="form-group">
                                        <label class="form-label">Card Number</label>
                                        <input type="text" class="form-control" placeholder="4242 4242 4242 4242" maxlength="19" id="card-number" oninput="formatCard(this)">
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label class="form-label">Expiry Date</label>
                                            <input type="text" class="form-control" placeholder="MM / YY" maxlength="7" id="card-expiry" oninput="formatExpiry(this)">
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label">CVV</label>
                                            <input type="text" class="form-control" placeholder="123" maxlength="4" id="card-cvv">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Order Summary -->
                <div>
                    <div class="card order-summary">
                        <div class="card-header"><h2>Order Summary</h2></div>
                        <div style="max-height:280px; overflow-y:auto;">
                            ${cartData.items.map(item => `
                                <div style="display:flex; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border);">
                                    <img src="${item.image || ''}" alt="${item.name}"
                                         style="width:48px; height:48px; object-fit:cover; border-radius:8px; background:var(--surface-alt);"
                                         onerror="this.style.display='none'">
                                    <div style="flex:1; min-width:0;">
                                        <div style="font-size:0.875rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                                        <div style="font-size:0.8rem; color:var(--ink-muted);">Qty: ${item.quantity}</div>
                                    </div>
                                    <div style="font-weight:700; font-size:0.9rem;">$${parseFloat(item.subtotal).toFixed(2)}</div>
                                </div>`).join('')}
                        </div>
                        <div class="card-body">
                            <div class="summary-row">
                                <span>Subtotal</span><span>$${cartData.total.toFixed(2)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Shipping</span>
                                <span>${shipping === 0 ? '<span style="color:var(--success);">FREE</span>' : '$' + shipping.toFixed(2)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Tax (8%)</span><span>$${tax.toFixed(2)}</span>
                            </div>
                            <div class="summary-row total">
                                <span>Total</span><span>$${grandTotal.toFixed(2)}</span>
                            </div>

                            <div id="checkout-error" style="background:var(--error-bg);color:var(--error);padding:12px;border-radius:8px;font-size:0.875rem;margin:16px 0;display:none;"></div>

                            <button onclick="placeOrder()" id="place-order-btn" class="btn btn-primary btn-full" style="margin-top:16px; font-size:1rem; padding:14px;">
                                🔒 Place Order — $${grandTotal.toFixed(2)}
                            </button>
                            <p style="font-size:0.75rem; color:var(--ink-muted); text-align:center; margin-top:10px;">
                                Your data is encrypted and secure.
                            </p>
                        </div>
                    </div>
                </div>
            </div>`;
    }

    function selectPayment(method, el) {
        selectedPayment = method;
        document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('card-fields').style.display = method === 'card' ? 'block' : 'none';
    }

    function formatCard(input) {
        let v = input.value.replace(/\D/g, '').substring(0, 16);
        input.value = v.replace(/(.{4})/g, '$1 ').trim();
    }

    function formatExpiry(input) {
        let v = input.value.replace(/\D/g, '').substring(0, 4);
        if (v.length >= 2) v = v.substring(0,2) + ' / ' + v.substring(2);
        input.value = v;
    }

    async function placeOrder() {
        const fname = document.getElementById('ship-fname').value.trim();
        const lname = document.getElementById('ship-lname').value.trim();
        const address = document.getElementById('ship-address').value.trim();
        const city = document.getElementById('ship-city').value.trim();
        const zip = document.getElementById('ship-zip').value.trim();
        const country = document.getElementById('ship-country').value;

        const errorEl = document.getElementById('checkout-error');
        errorEl.style.display = 'none';

        if (!fname || !lname || !address || !city || !zip) {
            errorEl.textContent = 'Please fill in all shipping fields.';
            errorEl.style.display = 'block';
            return;
        }

        const btn = document.getElementById('place-order-btn');
        btn.disabled = true;
        btn.textContent = 'Processing…';

        const { ok, data } = await apiFetch('/orders', {
            method: 'POST',
            body: JSON.stringify({
                shipping_address: { name: `${fname} ${lname}`, address, city, zip, country },
                payment_method: selectedPayment
            })
        });

        if (ok) {
            document.getElementById('checkout-content').style.display = 'none';
            document.getElementById('order-success').style.display = 'block';
            document.getElementById('success-order-id').textContent = `Order #${data.data.order_id}`;
            updateCartBadge();
        } else {
            btn.disabled = false;
            btn.textContent = `🔒 Place Order`;
            errorEl.textContent = data.message || 'Checkout failed. Please try again.';
            errorEl.style.display = 'block';
        }
    }

    document.addEventListener('DOMContentLoaded', loadCheckout);
</script>
</body>
</html>
